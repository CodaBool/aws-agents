# EC2 injects the `agents` key pair into this user
# ec2-user already exists (sysusers.d), cloud-init only adds the key + sudo rule
system_info:
  default_user:
    name: ec2-user
    lock_passwd: true
    groups: [wheel]
    sudo: ["ALL=(ALL) NOPASSWD:ALL"]
    shell: /bin/bash

# bootc-generic-growpart.service grows the root partition
growpart:
  mode: "off"
resize_rootfs: false
