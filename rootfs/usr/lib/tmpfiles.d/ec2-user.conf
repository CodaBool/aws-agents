# /var is only populated at install time, so build ec2-user's home on every boot instead
d /var/home/ec2-user          0700 ec2-user ec2-user -
d /var/home/ec2-user/.config  0755 ec2-user ec2-user -
d /var/home/ec2-user/src      0755 ec2-user ec2-user -

# same as `loginctl enable-linger ec2-user`, starts the user manager (and quadlets) at boot
f /var/lib/systemd/linger/ec2-user 0644 root root -
